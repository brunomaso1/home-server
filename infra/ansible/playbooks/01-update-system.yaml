---
- name: Update and upgrade system packages
  hosts: prod
  become: true

  vars:
    reboot_if_required: false

  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
        lock_timeout: 300

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required_file

    - name: Warn if a reboot is required
      ansible.builtin.debug:
        msg: "Reboot required. Re-run with -e reboot_if_required=true to reboot automatically."
      when:
        - reboot_required_file.stat.exists
        - not reboot_if_required | bool

    - name: Reboot if required and explicitly requested
      ansible.builtin.reboot:
      when:
        - reboot_required_file.stat.exists
        - reboot_if_required | bool